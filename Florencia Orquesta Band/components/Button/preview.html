<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
  #root { padding: 32px; display: flex; flex-direction: column; gap: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var F = window.FOB, h = React.createElement;
  var arrowLeft = h('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }, h('path', { d: 'm12 19-7-7 7-7' }), h('path', { d: 'M19 12H5' }));
  function row(kids) { return h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '12px', alignItems: 'center' } }, kids); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    row([
      h(F.Button, { key: 1 }, 'Reservar'),
      h(F.Button, { key: 2, variant: 'secondary' }, 'Ver repertorio'),
      h(F.Button, { key: 3, variant: 'outline' }, 'Ver evento'),
      h(F.Button, { key: 4, variant: 'ghost' }, 'Cancelar'),
      h(F.Button, { key: 5, variant: 'link' }, 'Más información'),
      h(F.Button, { key: 6, variant: 'destructive' }, 'Eliminar')
    ]),
    row([
      h(F.Button, { key: 1, size: 'sm' }, 'Pequeño'),
      h(F.Button, { key: 2, size: 'lg' }, 'Grande'),
      h(F.Button, { key: 3, size: 'icon', variant: 'outline', 'aria-label': 'Anterior', style: { borderRadius: '9999px', width: '2rem', height: '2rem' } }, arrowLeft),
      h(F.Button, { key: 4, disabled: true }, 'Deshabilitado')
    ])
  ));
</script>
</body>
</html>
