<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
  #root { padding: 32px; display: flex; gap: 24px; align-items: flex-start; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var F = window.FOB, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(F.Card, { style: { width: '340px' } },
      h(F.CardHeader, null,
        h(F.CardTitle, null, 'Bodas y quinceaños'),
        h(F.CardDescription, null, 'Música en vivo para la fiesta completa.')),
      h(F.CardContent, null, h('p', { style: { margin: 0, fontSize: '0.875rem', color: 'var(--color-fob-subtle)' } }, 'Salsa, merengue, cumbia, bolero y bachata.')),
      h(F.CardFooter, null, h(F.Button, null, 'Consultá disponibilidad')))
  );
</script>
</body>
</html>
